<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Historische Objecten</title>

    <meta name="theme-color" content="#1e4f7a">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }

        #melding {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,.9);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: Arial;
            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="melding">
Historische Objecten wordt geladen...
</div>

<iframe
    id="viewer"
    src="https://gk.historic.place/">
</iframe>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}

document.getElementById('viewer').onload = function () {
    document.getElementById('melding').style.display = 'none';
};
</script>

</body>
</html>
